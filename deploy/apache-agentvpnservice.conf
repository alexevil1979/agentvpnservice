# HTTP → HTTPS for agentvpnservice.1tlt.ru (keep ACME path on HTTP)
<VirtualHost *:80>
    ServerName agentvpnservice.1tlt.ru

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/agentvpnservice-error.log
    CustomLog ${APACHE_LOG_DIR}/agentvpnservice-access.log combined
</VirtualHost>
