# HTTPS reverse proxy → uvicorn on 127.0.0.1:8091
# Do NOT expose /ssd/www/agentvpnservice as DocumentRoot.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName agentvpnservice.1tlt.ru

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/

    ErrorLog ${APACHE_LOG_DIR}/agentvpnservice-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/agentvpnservice-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/agentvpnservice.1tlt.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/agentvpnservice.1tlt.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
