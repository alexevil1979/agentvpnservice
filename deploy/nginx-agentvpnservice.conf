# Place into nginx sites and enable. Adjust certificate paths to match this host.

server {
    listen 80;
    listen [::]:80;
    server_name agentvpnservice.1tlt.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agentvpnservice.1tlt.ru;

    # Replace with real cert paths used on 192.168.1.152 for 1tlt.ru
    ssl_certificate     /etc/letsencrypt/live/agentvpnservice.1tlt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentvpnservice.1tlt.ru/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
